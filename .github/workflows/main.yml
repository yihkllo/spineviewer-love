name: Windows Build

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: v1.0.0
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Qt
        shell: pwsh
        run: |
          python -m pip install aqtinstall
          python -m aqt install-qt -O C:/Qt windows desktop 6.8.3 win64_msvc2022_64 -m qtshadertools qtmultimedia qtimageformats

      - name: Build
        shell: pwsh
        run: |
          ./scripts/build.ps1 -QtRoot "C:/Qt/6.8.3/msvc2022_64"

      - name: Package
        shell: pwsh
        run: |
          ./scripts/package.ps1 -QtRoot "C:/Qt/6.8.3/msvc2022_64"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: SpineLoveEX-windows-x64
          path: dist/SpineLoveEX-windows-x64.zip
          if-no-files-found: error
          compression-level: 0

      - name: Publish release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.release_tag }}" "dist/SpineLoveEX-windows-x64.zip" --target "${{ github.sha }}" --title "SpineLoveEX ${{ inputs.release_tag }}" --generate-notes
